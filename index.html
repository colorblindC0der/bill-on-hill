<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Pizza Wizard</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #unity-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
      #unity-canvas {
        aspect-ratio: 16 / 9;
        width: min(100vw, 177.78vh);
        height: min(100vh, 56.25vw);
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/workForMe.loader.js";
      var config = {
        dataUrl: buildUrl + "/workForMe.data",
        frameworkUrl: buildUrl + "/workForMe.framework.js",
        codeUrl: buildUrl + "/workForMe.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "pizzaWizardGames",
        productName: "Pizza Wizard",
        productVersion: "0.5",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
